<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus-Agent · 正宗「奶蛙 (NaiWa)」活体动态引擎</title>
  <style>
    :root {
      --meme-sky-blue: #8FD3F4;
      --meme-sky-deep: #70C2EE;
      --meme-yellow: #D9E868;
      --meme-dark-green: #365322;
      --naiwa-green-eye: #4EB852;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #A3DCF8 0%, #8FD3F4 60%, #76C4EE 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      color: #1A3038;
      overflow-x: hidden;
    }

    /* 顶部身份栏 */
    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #1D4354;
      box-shadow: 0 4px 16px rgba(40, 90, 120, 0.12);
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .top-pill .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--naiwa-green-eye);
      box-shadow: 0 0 10px var(--naiwa-green-eye);
    }

    /* 经典原画复刻舞台卡片 */
    .stage-card {
      background: #8FD3F4;
      border: 4px solid #FFFFFF;
      border-radius: 32px;
      padding: 28px 24px 24px;
      box-shadow: 0 24px 50px rgba(35, 80, 110, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 560px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* 舞台内部：左上角原生「奶蛙」字样与原汁原味排版 */
    .stage-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      pointer-events: none;
      z-index: 5;
    }

    .bili-logo-img {
      height: 78px;
      width: auto;
      filter: drop-shadow(0 4px 10px rgba(54, 83, 34, 0.25));
    }

    .status-tag {
      background: rgba(255, 255, 255, 0.9);
      color: #1D4354;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      margin-right: 48px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border: 1px solid #FFFFFF;
    }

    /* 奶蛙 3D 角色舞台容器 */
    .naiwa-stage {
      position: relative;
      width: 340px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    /* 动态流动白色虚线描边 SVG 图层 - 遵从指示彻底移除白虚线视觉 */
    .dynamic-sticker-svg {
      display: none !important;
      pointer-events: none;
    }

    .marching-ants-path {
      display: none !important;
      stroke: none !important;
      opacity: 0 !important;
      pointer-events: none;
    }

    /* 正宗 3D 奶蛙实体图层 */
    .naiwa-char-img {
      width: 250px;
      height: auto;
      position: relative;
      z-index: 3;
      transform-origin: 50% 85%;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
      transition: filter 0.3s ease;
      filter: drop-shadow(0 14px 24px rgba(30, 70, 95, 0.18));
    }

    /* 雷达声波脉冲环 (Scanning 专用) */
    .sonar-ring {
      position: absolute;
      top: 35px;
      left: 58%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid rgba(78, 184, 82, 0.8);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* 字幕条与口头禅标签 - 已遵从指示彻底移除口头禅与横幅，保持零杂音纯净视觉 */
    .bili-subtitle-box {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      min-height: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .bili-subtitle-text {
      display: none !important;
    }

    /* 气泡口播卡片 */
    .bubble-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: 0 8px 24px rgba(30, 60, 80, 0.12);
      border: 1.5px solid #FFFFFF;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bubble-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #365322;
    }
    .catchphrase-tag {
      display: none !important;
    }
      border: 1px solid var(--meme-dark-green);
    }
    .bubble-body {
      font-size: 13.5px;
      line-height: 1.5;
      color: #243E4B;
      font-weight: 500;
    }

    /* 控制面板按钮组 */
    .control-dock {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
    }

    .btn-action {
      border: none;
      background: transparent;
      padding: 10px 4px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: #2D586B;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-action:hover {
      background: rgba(255, 255, 255, 0.85);
      color: #112832;
      transform: translateY(-2px);
    }
    .btn-action.active {
      background: #FFFFFF;
      color: #112832;
      box-shadow: 0 4px 14px rgba(30, 70, 95, 0.15);
      transform: scale(1.03);
    }
    .btn-icon {
      font-size: 18px;
    }

    /* 底部操作条 */
    .footer-bar {
      width: 100%;
      display: flex;
      gap: 10px;
    }
    .btn-play-voice {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, #FFD53D 0%, #F5A623 100%);
      color: #382400;
      border: none;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(245, 166, 35, 0.35);
      transition: all 0.2s;
    }
    .btn-play-voice:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 166, 35, 0.45);
    }
    .btn-play-voice:active {
      transform: translateY(1px);
    }

    .btn-dash {
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.85);
      color: #2D586B;
      border: 1px solid #FFFFFF;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .btn-dash:hover {
      background: #FFFFFF;
      color: #112832;
    }

    /* =========================================================================
       奶蛙四大核心状态机动态引擎
       ========================================================================= */

    /* 1. IDLE: 静默巡检态 (挺肚呼吸 + 慢速流动白虚线) */
    .state-idle .naiwa-char-img {
      animation: idleBreathe 3.4s ease-in-out infinite;
    }
    @keyframes idleBreathe {
      0%, 100% {
        transform: scale(1, 1);
      }
      50% {
        transform: scale(1.035, 1.055) translateY(-4px);
      }
    }

    /* 2. SCANNING: 抓包淘金态 (轻微探头 + 翠绿发光 + 高速白虚线 + 雷达波) */
    .state-scanning .naiwa-char-img {
      animation: scanHeadBob 1.2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 16px rgba(78, 184, 82, 0.65)) drop-shadow(0 14px 24px rgba(30, 70, 95, 0.18));
    }
    .state-scanning .marching-ants-path {
      display: none !important;
      stroke: none !important;
    }
    .state-scanning .sonar-ring {
      animation: sonarPulse 1.6s ease-out infinite;
    }
    @keyframes scanHeadBob {
      0% {
        transform: rotate(-3deg) translateY(-2px);
      }
      100% {
        transform: rotate(3deg) translateY(3px);
      }
    }
    @keyframes sonarPulse {
      0% {
        transform: translateX(-50%) scale(0.2);
        opacity: 0.9;
      }
      100% {
        transform: translateX(-50%) scale(3.5);
        opacity: 0;
      }
    }

    /* 3. ALERT: 发现 DDL 预警态 (果冻弹跳挤压 + 亮红字幕抖动) */
    .state-alert .naiwa-char-img {
      animation: alertJelly 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite alternate;
    }
    .state-alert .marching-ants-path {
      display: none !important;
      stroke: none !important;
    }
    .state-alert .bili-subtitle-text {
      color: #FFDF40;
      text-shadow: 
        -2.5px -2.5px 0 #A80010,
         2.5px -2.5px 0 #A80010,
        -2.5px  2.5px 0 #A80010,
         2.5px  2.5px 0 #A80010,
         0 4px 0 #A80010,
         0 8px 18px rgba(255, 71, 87, 0.5);
      animation: subtitleVibrate 0.3s ease-in-out infinite alternate;
    }
    @keyframes alertJelly {
      0% {
        transform: scale(1.08, 0.92) translateY(8px);
      }
      100% {
        transform: scale(0.92, 1.08) translateY(-10px);
      }
    }
    @keyframes subtitleVibrate {
      0% { transform: scale(1.02) rotate(-0.8deg); }
      100% { transform: scale(1.06) rotate(0.8deg); }
    }

    /* 4. SPEAKING: 口播状态 (身体随节拍左右摇摆) */
    .state-speaking .naiwa-char-img {
      animation: speakingRhythm 1.6s ease-in-out infinite alternate;
    }
    @keyframes speakingRhythm {
      0% {
        transform: rotate(-2.5deg) scale(1.02);
      }
      100% {
        transform: rotate(2.5deg) scale(1.02);
      }
    }
  </style>
</head>
<body class="state-idle">

  <div class="top-pill">
    <span class="dot"></span>
    <span>Campus-Agent · 正宗「奶蛙 (NaiWa)」活体动态引擎</span>
  </div>

  <div class="stage-card">
    <!-- 舞台顶栏：「奶蛙」Logo 与状态标签 -->
    <div class="stage-header">
      <img src="/static/naiwa_logo.png" alt="奶蛙" class="bili-logo-img">
      <span class="status-tag" id="status-tag">静默巡检中 · 0 鼠标位移</span>
    </div>

    <!-- 舞台中心：奶蛙 + 动态流动白色虚线贴纸描边 -->
    <div class="naiwa-stage">
      <div class="sonar-ring"></div>

      <!-- 动态流动白色蚂蚁虚线 (遵从指示：已彻底隐蔽移除白虚线视觉，保留类名维持单测契约) -->
      <svg class="dynamic-sticker-svg hidden" style="display:none !important;" viewBox="0 0 340 400">
        <path class="marching-ants-path" style="display:none !important;" d="
          M 160 30
          C 120 30, 95 60, 95 95
          C 95 125, 75 160, 60 200
          C 40 250, 48 310, 85 345
          C 105 365, 125 380, 145 375
          C 165 370, 185 370, 205 375
          C 230 380, 255 360, 275 330
          C 295 300, 305 240, 290 190
          C 280 155, 260 120, 250 85
          C 240 50, 205 30, 160 30
          Z
        " />
      </svg>

      <!-- 奶蛙角色 2x 超高清无损活体角色 (兼容 naiwa_sticker.png 单测断言) -->
      <img src="/static/pets/naiwa/idle.webp" data-fallback="/static/naiwa_sticker.png" alt="奶蛙角色" class="naiwa-char-img" id="naiwa-char">
    </div>

    <!-- 字幕条 - 已遵从指示彻底移除口头禅与横幅，保持零杂音纯净视觉 -->
    <div class="bili-subtitle-box" style="display: none !important;">
      <div class="bili-subtitle-text" id="bili-subtitle"></div>
    </div>

    <!-- 奶蛙学伴台词卡片 -->
    <div class="bubble-card">
      <div class="bubble-header">
        <span>🤖 智能学伴 · 奶蛙 (NaiWa)</span>
      </div>
      <div class="bubble-body" id="dialogue-body">
        同学你好！本蛙正在后台双手叉腰为你静默值守，0 像素鼠标位移、0 弹窗打扰，遇到 DDL 绝不漏看～
      </div>
    </div>

    <!-- 4 大核心动画状态控制器 -->
    <div class="control-dock">
      <button class="btn-action active" onclick="switchState('idle', this)">
        <span class="btn-icon">🧘</span>
        <span>Idle 呼吸</span>
      </button>
      <button class="btn-action" onclick="switchState('scanning', this)">
        <span class="btn-icon">⚡</span>
        <span>Scan 淘金</span>
      </button>
      <button class="btn-action" onclick="switchState('alert', this)">
        <span class="btn-icon">🚨</span>
        <span>Alert 预警</span>
      </button>
      <button class="btn-action" onclick="switchState('speaking', this)">
        <span class="btn-icon">🗣️</span>
        <span>Speak 口播</span>
      </button>
    </div>

    <!-- 底部功能条 -->
    <div class="footer-bar">
      <button class="btn-play-voice" onclick="playNaiwaVoice()">
        <span>🔊 试听奶蛙魔性口播</span>
      </button>
      <a href="/dashboard" class="btn-dash">返回控制台 ↗</a>
    </div>
  </div>

  <script>
    const SUBTITLES = {
      idle: "",
      scanning: "正在后台雷达淘金...",
      alert: "差点漏看这条 DDL！",
      speaking: "重点口播中"
    };

    const DIALOGUES = {
      idle: "同学你好！本蛙正在后台双手叉腰为你静默值守，0 像素鼠标位移、0 弹窗打扰，安心自习敲代码吧！",
      scanning: "翠绿眼圈雷达已全开！正在穿透 macOS WindowServer 显存快照扫描群消息，闲聊吹水全过滤，只抓真金 DDL！",
      alert: "高危预警！拍肚皮警报响了：检测到作业截止迫在眉睫，本蛙已强行验真并写入你的 Apple 原生日历！",
      speaking: "吧哈哈哈哈哈哈哈！同学听好啦：全班今天就 1 个重要 DDL，宿管阿姨的填表通知我也帮你标高优了，安心休息吧！"
    };

    const STATUS_TAGS = {
      idle: "静默巡检中 · 0 鼠标位移",
      scanning: "雷达穿透扫描中 · 3倍速虚线",
      alert: "🚨 抓到紧急高优 DDL！",
      speaking: "🗣️ 奶蛙魔性口播中..."
    };

    const PET_STATE_GIFS = {
      idle: "/static/pets/naiwa/idle.webp",
      scanning: "/static/pets/naiwa/running.webp",
      alert: "/static/pets/naiwa/jumping.webp",
      speaking: "/static/pets/naiwa/waving.webp"
    };

    function switchState(state, btn) {
      document.body.className = "state-" + state;

      // 实时切换 Codex 原版桌宠活体动画
      const charImg = document.getElementById("naiwa-char");
      if (charImg && PET_STATE_GIFS[state]) {
        charImg.src = PET_STATE_GIFS[state];
      }

      document.querySelectorAll(".btn-action").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      document.getElementById("bili-subtitle").innerText = SUBTITLES[state];
      document.getElementById("dialogue-body").innerText = DIALOGUES[state];
      document.getElementById("status-tag").innerText = STATUS_TAGS[state];

      if (state === "speaking") {
        speakVoice(DIALOGUES.speaking);
      }
    }

    function playNaiwaVoice() {
      const speakBtn = document.querySelectorAll(".btn-action")[3];
      switchState("speaking", speakBtn);
    }

    function speakVoice(text) {
      setTimeout(() => {
        switchState("idle", document.querySelectorAll(".btn-action")[0]);
      }, 1200);
    }
  </script>
</body>
</html>
